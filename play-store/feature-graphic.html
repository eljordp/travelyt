<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travelyt Google Play feature graphic</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
      body {
        background: #081546;
        color: #fff;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .canvas {
        position: relative;
        width: 1024px;
        height: 500px;
        overflow: hidden;
        isolation: isolate;
      }
      .wing {
        position: absolute;
        inset: auto;
        z-index: -2;
        transform: rotate(-8deg);
      }
      .wing-a {
        width: 570px;
        height: 440px;
        right: -110px;
        bottom: -220px;
        background: #5f82bd;
        clip-path: polygon(48% 0, 100% 88%, 70% 100%, 0 42%);
      }
      .wing-b {
        width: 430px;
        height: 400px;
        right: 92px;
        bottom: -245px;
        background: #274b8a;
        clip-path: polygon(54% 0, 100% 100%, 0 84%);
      }
      .route {
        position: absolute;
        width: 560px;
        height: 255px;
        right: 12px;
        top: 38px;
        border-top: 5px solid #ff6868;
        border-radius: 50%;
        transform: rotate(-13deg);
        opacity: 0.9;
      }
      .logo {
        position: absolute;
        width: 425px;
        height: auto;
        left: 72px;
        top: 68px;
      }
      .copy {
        position: absolute;
        left: 92px;
        bottom: 20px;
      }
      .eyebrow {
        margin: 0 0 12px;
        color: #ff7a85;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        max-width: 560px;
        font-size: 50px;
        line-height: 0.98;
        letter-spacing: -0.045em;
      }
      .tag {
        position: absolute;
        right: 74px;
        bottom: 55px;
        display: flex;
        align-items: center;
        gap: 11px;
        color: rgba(255,255,255,0.76);
        font-size: 15px;
        font-weight: 700;
      }
      .tag::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #ff6868;
        box-shadow: 0 0 0 6px rgba(255,104,104,0.18);
      }
    </style>
  </head>
  <body>
    <main class="canvas" aria-label="Travelyt Google Play feature graphic">
      <div class="wing wing-a"></div>
      <div class="wing wing-b"></div>
      <div class="route"></div>
      <img class="logo" src="../public/logo-white.png" alt="Travelyt" />
      <div class="copy">
        <p class="eyebrow">Travel light</p>
        <h1>Move your bags.<br />Move on.</h1>
      </div>
      <div class="tag">Hands-free luggage help</div>
    </main>
  </body>
</html>
